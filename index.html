<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="NAARIZE clickable prototype: onboarding to Home.">
<title>NAARIZE App Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: the phone sits left, a narrow control rail sits right; they stack on narrow screens.
   Page chrome follows the viewer's theme. The app inside the phone keeps its own light look on purpose. */
:root{
  --bg:#F2EAED;--panel:#FFFFFF;--fg:#2A1724;--mut:#6B5A66;--line:#E3D3DA;--acc:#682B54;--acc-fg:#FFFFFF;--soft:#F7EEF1;--bezel:#1C1018;
  --disp:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--brandf:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140D12;--panel:#1E151B;--fg:#F3E8EE;--mut:#B9A6B2;--line:#352731;--acc:#E7A1C9;--acc-fg:#1E151B;--soft:#261B22;--bezel:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140D12;--panel:#1E151B;--fg:#F3E8EE;--mut:#B9A6B2;--line:#352731;--acc:#E7A1C9;--acc-fg:#1E151B;--soft:#261B22;--bezel:#000000;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px}
.dwrap{width:calc(418px * var(--s,1));height:calc(872px * var(--s,1));flex:none}
.device{width:418px;height:872px;padding:14px;box-sizing:border-box;border-radius:60px;background:var(--bezel);transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 40px 80px -30px rgba(59,29,51,.5)}

/* ---------- control rail ---------- */
.panel{flex:1 1 300px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:20px;padding-top:4px}
.panel h1{margin:0;font:600 26px/1.15 var(--disp);letter-spacing:-.01em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--mut);font-size:15px;line-height:1.5}
.ph{margin:0 0 8px;font:600 11px/1.2 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pb{font:500 14px/1.25 var(--disp);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:36px;padding:6px 11px;cursor:pointer;text-align:left}
.pb:hover{border-color:var(--acc)}
.pb.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.pb[disabled]{opacity:.45;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pgrid .pb{display:flex;flex-direction:column;gap:2px}
.pb small{font:400 12px var(--f);opacity:.8}
.ptog{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;background:none;border:0;color:var(--fg);cursor:pointer;width:100%;font:500 14px var(--f);text-align:left;padding:0}
.trow+.trow{border-top:1px solid var(--line)}
.trow[disabled]{opacity:.45;cursor:not-allowed}
.psw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.psw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:var(--panel);transition:transform .15s}
.trow[aria-checked="true"] .psw{background:var(--acc)}
.trow[aria-checked="true"] .psw::after{transform:translateX(16px)}
.pact{display:flex;flex-wrap:wrap;gap:6px}
.pstate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.pstate dt{color:var(--mut);font:600 11px/1.6 var(--disp);text-transform:uppercase;letter-spacing:.08em}
.pstate dd{margin:0;min-width:0}
.pnote{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0}
.panel :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- the app (fixed light look) ---------- */
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#FFFFFF;color:#3B1D33;font-family:var(--f);font-size:16px;line-height:1.45;color-scheme:light}
.screen *{box-sizing:border-box}
.screen button,.screen input{font-family:inherit}
.screen :focus-visible{outline:3px solid #8E3F86;outline-offset:2px}
#app{position:absolute;inset:0}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#FCE6DD 0%,#FBEFF2 14%,#FFFFFF 34%)}
.scr.cool{background:linear-gradient(180deg,#F1E1EC 0%,#F8EFF4 16%,#FFFFFF 34%)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.pad{padding:8px 24px 16px}
.foot{padding:12px 24px 30px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.h1{margin:0;font:600 28px/1.18 var(--disp);letter-spacing:-.01em;text-wrap:balance;color:#3B1D33}
.h2{margin:0;font:600 23px/1.25 var(--disp);text-wrap:balance;color:#3B1D33}
.h3{margin:0;font:600 19px/1.3 var(--disp);color:#3B1D33}
.p{margin:0;font-size:16px;line-height:1.5;color:#4A3A44}
.why{margin:0;font-size:15px;line-height:1.45;color:#6B5A66}
.mut{color:#6B5A66}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fl{font:600 12px/1.2 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#6B5A66}
.lbl{margin:0;font:600 12px/1.2 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#6B5A66}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:28px;font:600 17px/1.2 var(--disp);border:0;cursor:pointer;text-align:center;text-decoration:none;transition:transform .12s,box-shadow .12s}
.btn:active:not([disabled]){transform:scale(.98)}
.btn-p{background:linear-gradient(100deg,#7E3566,#5A2148);color:#FFFFFF;box-shadow:0 12px 24px -10px rgba(90,33,72,.6)}
.btn-s{background:#FFFFFF;color:#682B54;box-shadow:inset 0 0 0 1.5px #D9BFCD,0 3px 8px rgba(104,43,84,.10)}
.btn-s:hover:not([disabled]){box-shadow:inset 0 0 0 1.5px #B892A7,0 3px 8px rgba(104,43,84,.14)}
.btn-sel{background:#682B54;color:#FFFFFF;box-shadow:0 8px 18px -10px rgba(90,33,72,.7)}
.btn-r{background:#A33A24;color:#FFFFFF;box-shadow:0 10px 20px -10px rgba(163,58,36,.6)}
.btn-pe{background:linear-gradient(100deg,#FDE3D6,#F7BDA9);color:#3B1D33}
.btn-fr{background:rgba(255,255,255,.14);color:#FFF6F1;box-shadow:inset 0 0 0 1.5px rgba(253,227,214,.5)}
.btn.sm{min-height:46px;font-size:15.5px;border-radius:23px;padding:0 12px;white-space:nowrap}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.tlink{background:none;border:0;padding:0 2px;min-height:44px;display:inline-flex;align-items:center;gap:6px;font:600 15px var(--disp);color:#682B54;cursor:pointer;text-decoration:none}
.tlink[disabled]{color:#6B5A66;cursor:default}
.back{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px 0 16px;border-radius:24px;background:#FFFFFF;border:0;box-shadow:0 8px 20px -8px rgba(59,29,51,.25);font:600 14px var(--disp);letter-spacing:.1em;color:#3B1D33;cursor:pointer;flex:none}
.ib1{width:44px;height:44px;border-radius:22px;border:0;background:#FFFFFF;box-shadow:0 6px 16px -8px rgba(59,29,51,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3B1D33;padding:0;flex:none}
.help{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;background:#FBE3DE;color:#A33A24;font:600 15px var(--disp);border:0;cursor:pointer;flex:none}
.help:hover{background:#F8D5CD}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 24px 8px}
.step{font:600 11.5px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#6B5A66;background:rgba(245,233,239,.9);border-radius:14px;padding:6px 10px}
.progbar{height:6px;border-radius:3px;background:#F1E4E8;margin:6px 24px 0;overflow:hidden;flex:none}
.progbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#C38BB4,#E2877E,#F7BDA9);transition:width .3s}
.card{background:#FBF6F4;border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;flex:none}
.ct{margin:0;font:600 18px/1.3 var(--disp);color:#3B1D33}
.cp{margin:0;font-size:15px;line-height:1.45;color:#4A3A44}
.inp{height:58px;padding:0 18px;border-radius:20px;background:#FFFFFF;border:1.5px solid #E6D8DE;font:500 19px var(--disp);color:#3B1D33;outline:none;width:100%;min-width:0}
.inp:focus{border:2px solid #682B54}
.inp::placeholder{color:#9A8A94;font-weight:400}
.cc{height:58px;border:0;cursor:pointer;padding:0 14px;border-radius:20px;background:#FBF6F4;display:flex;align-items:center;gap:4px;font:500 19px var(--disp);flex:none;color:#3B1D33}
.cc .ico{color:#6B5A66}
.brand{font:600 21px var(--brandf);letter-spacing:.14em;color:#3B1D33}
.logo{border-radius:50%;flex:none;display:block}
.otp{position:relative}
.otp-in{position:absolute;inset:0;width:100%;height:100%;opacity:.01;border:0;z-index:2;font-size:16px;cursor:text}
.otp-boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ob{height:62px;border-radius:18px;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #D9BFCD;display:flex;align-items:center;justify-content:center;font:400 26px var(--disp);color:#3B1D33}
.otp:focus-within .ob.cur{box-shadow:inset 0 0 0 2px #682B54}
.warn{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,#FDE3D6,#FBE3DE);border-radius:20px;padding:14px 18px;color:#3B1D33;font:600 15px var(--disp)}
.warn .ico{color:#A33A24}
.ok-note{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;color:#682B54;font:600 11.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;background:#F5E9EF;border-radius:12px;padding:6px 10px}
.years{position:relative;height:236px;overflow-y:auto;background:#FBF6F4;border-radius:24px;padding:8px;display:flex;flex-direction:column;gap:2px;flex:none;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.yr{min-height:46px;border:0;background:transparent;border-radius:16px;font:400 19px var(--disp);color:#8E7E88;cursor:pointer;flex:none}
.yr:hover{background:#FFFFFF;color:#3B1D33}
.yr.on{background:#FFFFFF;color:#682B54;font-weight:600;font-size:23px;box-shadow:0 8px 18px -10px rgba(59,29,51,.35)}
.dl{display:grid;grid-template-columns:110px minmax(0,1fr);column-gap:12px;row-gap:8px;margin:0;font-size:14.5px;line-height:1.4}
.dl dt{color:#6B5A66;font:600 12.5px/1.5 var(--disp)}
.dl dd{margin:0;color:#4A3A44}
.note{margin:0;font-size:14px;line-height:1.45;color:#4A3A44;background:#F5E9EF;border-radius:16px;padding:10px 14px}
.oi{width:48px;height:48px;border-radius:24px;background:linear-gradient(135deg,#FDE6DA,#F7BDA9 55%,#E2877E);color:#3B1D33;display:flex;align-items:center;justify-content:center;flex:none}
.oi.cool{background:linear-gradient(135deg,#F5E9EF,#D9B6CF 60%,#B57CA6)}
.oi.sm{width:36px;height:36px}
.ab{width:30px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font:600 14px var(--disp);color:#3B1D33;background:linear-gradient(135deg,#FDE6DA,#F7BDA9);flex:none}
.ab.cool{background:linear-gradient(135deg,#F5E9EF,#D9B6CF)}
.tag{font:600 11.5px var(--disp);letter-spacing:.1em;text-transform:uppercase;border-radius:14px;padding:6px 10px;background:#FFFFFF;color:#682B54;flex:none;display:inline-flex;align-items:center;gap:4px}
.tag.grey{background:#F5E9EF;color:#6B5A66}
.tag.coral{color:#A8452E}
.ot{margin:0;font:600 17px/1.3 var(--disp);color:#3B1D33}
.od{margin:2px 0 0;font-size:14.5px;line-height:1.4;color:#6B5A66}
.sw{width:52px;height:32px;border-radius:16px;background:#9E8796;border:0;position:relative;cursor:pointer;padding:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#FFFFFF;box-shadow:0 1px 3px rgba(59,29,51,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:#682B54}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;font-size:16px}
.swrow+.swrow{border-top:1px solid #EFE3E8}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chip{display:flex;flex-direction:column;gap:4px;justify-content:flex-start;min-height:112px;padding:14px;border-radius:24px;border:0;background:#FBF6F4;text-align:left;cursor:pointer;color:#3B1D33;transition:transform .12s}
.chip:active{transform:scale(.98)}
.chip .ti{width:28px;height:28px;border-radius:14px;background:linear-gradient(135deg,#FDE6DA,#F7BDA9);display:flex;align-items:center;justify-content:center;color:#682B54;margin-bottom:4px}
.chip:nth-child(even) .ti{background:linear-gradient(135deg,#F5E9EF,#D9B6CF)}
.chip b{font:600 15.5px/1.25 var(--disp)}
.chip small{font-size:13.5px;color:#6B5A66;line-height:1.3}
.chip:hover{background:#F7EEEC}
.chip.on{background:linear-gradient(135deg,#FDE6DA,#F7BDA9 55%,#E2877E);box-shadow:0 14px 26px -14px rgba(212,112,85,.8)}
.chip.on small{color:#4A3A44}
.chip.on .ti{background:#FFFFFF}
.chip.more{background:transparent;box-shadow:inset 0 0 0 1.5px #E6D8DE;outline-offset:-2px;border:1.5px dashed #D9BFCD}
.chip.more b{display:flex;align-items:center;gap:4px}
.inbar{display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:30px;padding:5px 5px 5px 20px;box-shadow:0 10px 24px -12px rgba(59,29,51,.3),inset 0 0 0 1px #EFE3E8}
.inbar input{flex:1;min-width:0;height:46px;border:0;outline:none;font-size:16.5px;background:transparent;color:#3B1D33}
.inbar input::placeholder,.inbar2 input::placeholder{color:#76626F}
.ib{width:46px;height:46px;border-radius:23px;border:0;background:#FBF6F4;color:#682B54;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ib.send{background:linear-gradient(135deg,#7E3566,#5A2148);color:#FFFFFF}
.ib.mic{background:linear-gradient(135deg,#FDE6DA,#E2877E);color:#3B1D33}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kt{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:26px;border:0;background:#FFFFFF;box-shadow:0 12px 26px -16px rgba(59,29,51,.4),inset 0 0 0 1px #F2E7EB;cursor:pointer;text-align:center;color:#3B1D33;font:600 15px/1.25 var(--disp);transition:transform .12s}
.kt:active{transform:scale(.98)}
.kt img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:18px;display:block}
.kt span{min-height:38px;display:flex;align-items:center;justify-content:center;padding:0 2px}
.picked{align-self:flex-start;display:flex;gap:6px;align-items:center;background:#F5E9EF;color:#682B54;border-radius:14px;padding:6px 12px;font:600 11.5px var(--disp);letter-spacing:.08em;text-transform:uppercase}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 20px 20px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.aig{text-align:center;font-size:13px;color:#6B5A66;padding:10px 0 4px;flex:none}
.bot{margin:0;background:#FBF6F4;border-radius:8px 24px 24px 24px;padding:14px 18px;font-size:16.5px;line-height:1.45;max-width:300px;align-self:flex-start;color:#3B1D33}
.me{margin:0;background:linear-gradient(110deg,#7E3566,#5A2148);color:#FFFFFF;border-radius:24px 8px 24px 24px;padding:12px 18px;font:500 16px/1.35 var(--disp);align-self:flex-end;max-width:260px}
.opts{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.opt{min-height:44px;padding:10px 20px;border-radius:24px;border:0;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #D9BFCD,0 3px 8px rgba(104,43,84,.1);color:#682B54;font:600 15px/1.3 var(--disp);text-align:left;cursor:pointer}
.opt:hover{box-shadow:inset 0 0 0 1.5px #B892A7,0 3px 8px rgba(104,43,84,.14)}
.opt.q{background:#FBF6F4;box-shadow:none;color:#4A3A44}
.qn{display:flex;align-items:center;gap:8px;font:600 12px var(--disp);letter-spacing:.06em;color:#6B5A66;margin-top:4px}
.dot{width:14px;height:6px;border-radius:3px;background:#EBDCE3}
.dot.on{background:linear-gradient(90deg,#C38BB4,#E2877E)}
.typing{display:flex;gap:5px;padding:16px 18px}
.typing span{width:8px;height:8px;border-radius:4px;background:#C9A9BC;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.inbar2{padding:10px 20px 30px;display:flex;align-items:center;gap:8px;flex:none}
.inbar2 input{flex:1;min-width:0;height:52px;border-radius:26px;border:0;padding:0 20px;font-size:16px;background:#FFFFFF;color:#3B1D33;outline:none;box-shadow:0 10px 24px -12px rgba(59,29,51,.3),inset 0 0 0 1px #EFE3E8}
.inbar2 input:focus{box-shadow:inset 0 0 0 2px #682B54}
.rf{background:#FBE3DE;border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 1.5px #EBA899;flex:none}
.rfh{display:flex;gap:12px;align-items:center}
.rfi{width:40px;height:40px;border-radius:20px;background:#A33A24;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.rfh h2{margin:0;font:600 17px/1.3 var(--disp);color:#7A2416}
.rf p{margin:0;font-size:15px;line-height:1.45;color:#4A3A44}
.tips{background:#FFFFFF;border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 30px -18px rgba(59,29,51,.4),inset 0 0 0 1px #F2E7EB;flex:none}
.tipsh{display:flex;align-items:center;gap:12px}
.tipsh img{width:48px;height:48px;border-radius:24px;object-fit:cover}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;color:#4A3A44}
.num{width:28px;height:28px;border-radius:14px;background:linear-gradient(135deg,#FDE6DA,#F7BDA9);color:#3B1D33;font:600 14px var(--disp);display:flex;align-items:center;justify-content:center;flex:none}
.tip:nth-child(odd) .num{background:linear-gradient(135deg,#F5E9EF,#D9B6CF)}
.rev{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#6B5A66;background:#F7EEEC;border-radius:12px;padding:6px 10px}
.item{background:#FBF6F4}
.item.on{box-shadow:inset 0 0 0 2px #682B54}
.item.off{opacity:.6}
.said{margin:0;font-size:14.5px;color:#6B5A66;font-style:italic}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tl i{height:8px;border-radius:4px;background:rgba(255,255,255,.22)}
.tl i.on{background:#F7BDA9}
.tlt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:12px;line-height:1.25;color:#F4C6B6;text-align:center}
.tlt .on{color:#FFF6F1;font-weight:700}
.hh{padding:22px 22px 6px;display:flex;flex-direction:column;gap:10px}
.hello{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:#3B1D33}
.hello img{width:46px;height:46px;border-radius:23px;object-fit:cover;box-shadow:0 0 0 3px #FFFFFF,0 6px 14px -6px rgba(59,29,51,.4)}
.hello .hi{font:300 23px/1.1 var(--disp);white-space:nowrap}
.hello .hi b{font-weight:600}
.dzl{white-space:nowrap;align-self:flex-start;display:inline-flex;align-items:center;gap:4px;margin-top:4px;font:600 12px var(--disp);color:#6B5A66;background:rgba(245,233,239,.9);border-radius:10px;padding:3px 8px}
.dzl.on{background:#682B54;color:#FFFFFF}
.hb{padding:10px 22px 18px;gap:10px}
.dark{position:relative;overflow:hidden;color:#FFF6F1;box-shadow:0 18px 34px -16px rgba(59,29,51,.65);background:linear-gradient(135deg,#8A3B78,#5E2350 55%,#3B1D33)}
.dark.deep{background:linear-gradient(135deg,#74306A,#4A1C40 55%,#2E1528)}
.dark.night{background:linear-gradient(135deg,#5A2A50,#33172D 55%,#1E0E1A)}
.dark .lbl,.dark .tag{color:#FDE3D6}
.dark .tag{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(253,227,214,.35)}
.dark .ct,.dark .h1{color:#FFF6F1}
.dark .cp,.dark .sub{color:#F4C6B6}
.dark .halo{position:absolute;width:220px;height:220px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(253,227,214,.5),rgba(226,135,126,.15) 50%,rgba(226,135,126,0) 70%);pointer-events:none}
.dark.night .halo{background:radial-gradient(circle,rgba(243,230,238,.45),rgba(226,135,126,.12) 50%,rgba(226,135,126,0) 70%)}
.stimg{position:absolute;right:-6px;top:-18px;width:122px;height:122px;object-fit:contain;pointer-events:none}
.dark>*:not(.halo):not(.stimg){position:relative}
.dark .narrow{max-width:196px}
.acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.chg{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:23px;background:#FFFFFF;border:0;color:#682B54;font:600 15px var(--disp);cursor:pointer;flex:none}
.rnd{width:46px;height:46px;border-radius:23px;background:#FFFFFF;border:0;color:#3B1D33;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.frost{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:23px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(253,227,214,.35);border:0;color:#FDE3D6;font:600 15px var(--disp);cursor:pointer}
.mb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mb i{height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
.mb i.on{background:#F7BDA9}
.nx{display:flex;gap:14px;align-items:flex-start}
.nx img{width:72px;height:72px;border-radius:20px;object-fit:cover;flex:none}
.nx .stack{gap:4px;flex:1;min-width:0}
.nxa{display:flex;gap:18px;align-items:center;margin-top:2px}
.nxa button{background:none;border:0;padding:0;min-height:36px;font:600 14.5px var(--disp);color:#682B54;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nxa button.alt{color:#6B5A66}
.strong{box-shadow:inset 0 0 0 1.5px #682B54}
.meta{font:600 11.5px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#6B5A66}
.ansg{display:grid;gap:8px}
.ansr{display:flex;gap:6px}
.ansr .ans{flex:1 1 auto}
.ans{min-height:44px;border-radius:22px;border:0;background:#FFFFFF;box-shadow:inset 0 0 0 1.5px #D9BFCD,0 3px 8px rgba(104,43,84,.1);color:#682B54;font:500 15px/1.2 var(--disp);padding:6px 14px;cursor:pointer;white-space:nowrap}
.ans:hover{box-shadow:inset 0 0 0 1.5px #B892A7,0 3px 8px rgba(104,43,84,.14)}
.go{display:flex;align-items:center;gap:6px;min-height:44px;border:0;background:transparent;padding:0;font:600 14.5px var(--disp);color:#682B54;cursor:pointer;text-align:left;width:100%;white-space:nowrap}
.go b{color:#6B5A66;font-weight:500}
.pat{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pat .big{font:300 46px/1 var(--disp);color:#3B1D33}
.pat .big small{font-size:18px;color:#6B5A66}
.pd{display:flex;gap:6px}
.pd i{width:10px;height:10px;border-radius:5px;background:#F1E4E8}
.pd i.on{background:#D47055}
.ntc{background:linear-gradient(135deg,#F5E9EF,#E9D3E2);}
.ntc .lbl{color:#682B54}
.ntc .ct{font-size:16.5px;line-height:1.4}
.pnp{margin:0;font-size:13.5px;font-style:italic;color:#6B5A66}
.spark{color:#8E3F86}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px -18px rgba(59,29,51,.35);padding:8px 10px 24px;flex:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font:500 13px var(--disp);color:#6B5A66;background:none;border:0;cursor:pointer}
.tab .pill{width:52px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#3B1D33;font-weight:600}
.tab.on .pill{background:linear-gradient(135deg,#FDE6DA,#F7BDA9)}
.big .ct{font-size:20px}
.big .ans{min-height:52px;font-size:17px}
.ov{position:absolute;inset:0;background:rgba(43,20,36,.5);border:0;width:100%;padding:0;cursor:pointer;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:#FFFFFF;border-radius:40px 40px 0 0;padding:10px 24px 32px;display:flex;flex-direction:column;gap:14px;z-index:21;animation:up .22s ease-out;scrollbar-width:none}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#E6D8DE;align-self:center;flex:none}
.banner{width:100%;height:150px;object-fit:cover;border-radius:24px;display:block}
.emg{background:#FBE3DE;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.emh{color:#7A2416;font:600 16px var(--disp)}
.call{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;border-radius:20px;background:#A33A24;color:#FFFFFF;font:600 18px var(--disp);text-decoration:none}
.call:hover{background:#8E2F1C;color:#FFFFFF}
.call small{font:500 12px var(--f)}
.hrow{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 14px;border-radius:24px;border:0;background:#FBF6F4;text-align:left;cursor:pointer;width:100%;color:#3B1D33;text-decoration:none;font-size:16px}
.hrow b{font-family:var(--disp);font-weight:600}
.hrow:hover{background:#F7EEEC;color:#3B1D33}
.hrow small{font-size:14px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:280px;align-self:center}
.key{min-height:62px;border-radius:31px;border:0;background:#FBF6F4;font:400 26px var(--disp);cursor:pointer;color:#3B1D33;display:flex;align-items:center;justify-content:center}
.key:hover{background:#F5E9EF}
.key.blank{visibility:hidden}
.pdots{display:flex;gap:14px;justify-content:center}
.pdots i{width:16px;height:16px;border-radius:8px;box-shadow:inset 0 0 0 2px #682B54}
.pdots i.on{background:#682B54}
.lock{position:absolute;inset:0;z-index:40;background:linear-gradient(180deg,#FCE6DD,#FFFFFF 40%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 40px}
.toast{position:absolute;left:20px;right:20px;bottom:110px;z-index:50;background:#3B1D33;color:#FFF6F1;border-radius:20px;padding:13px 18px;font-size:15px;line-height:1.4;box-shadow:0 14px 30px rgba(59,29,51,.35)}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slist li{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.4;color:#4A3A44}
.slist li .ico{color:#682B54;margin-top:1px}
.cyc{display:flex;gap:8px;flex-wrap:wrap}
.cyc span{background:#FFFFFF;color:#682B54;border-radius:14px;padding:6px 12px;font:600 15px var(--disp)}
.art{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;width:100%;background:none;border:0;padding:0;min-height:44px;color:#3B1D33}
.art .ico{color:#682B54}
.art b{font:600 16px var(--disp)}
.art img{width:56px;height:56px;border-radius:16px;object-fit:cover;flex:none}
.hero{position:relative;flex:none;height:430px;display:flex;flex-direction:column;align-items:center;padding-top:44px;background:linear-gradient(180deg,#EED9E6 0%,#F8D6CA 55%,#F1B9A6 100%)}
.hero img.w{width:300px;height:300px;object-fit:contain;margin-top:6px}
.wsheet{flex:1;background:#FFFFFF;border-radius:40px 40px 0 0;margin-top:-40px;position:relative;padding:28px 24px 30px;display:flex;flex-direction:column;gap:14px}
.crev{display:flex;align-items:center;gap:12px;background:#F7EEEC;border-radius:20px;padding:10px 14px}
.vb{width:44px;height:44px;border-radius:22px;background:linear-gradient(135deg,#F7BDA9,#E2877E);color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.u18{width:200px;height:200px;object-fit:contain}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.typing span{animation:none}.sw,.sw::after,.psw,.psw::after,.btn,.chip,.kt{transition:none}}
</style>
</head>

function afterPeriod(){const a=S.ans,y=a.years;
 const stopped=a.period==='stopped'||(S.knows==='meno'&&(y==='1-2'||y==='2+'))||(S.knows==='post'&&['1-2','3-5','5+'].includes(y));
 if(stopped&&!a.bleed)return ask('bleed');
 afterSafety();}
function afterSafety(){const a=S.ans,ag=age();
 const changes=(a.period&&!['regular','unsure','hormones'].includes(a.period))||(S.knows&&S.knows!=='unsure');
 if(ag!==null&&ag<40&&changes&&!a.u40&&a.doctor!=='yes')return ask('under40');
 startTopic();}
function startTopic(){const T=TOPICS[S.topic];bot(`Thanks, that helps. Now 3 quick questions about ${T.short}, then I'll share what may help.`);S.tq=0;askTopic();}
function askTopic(){const T=TOPICS[S.topic];if(S.tq>=3)return giveTips();
 const q=T.qs[S.tq];S.chat.push({k:'prog',n:S.tq+1});bot(q.q);S.q={id:'topic',o:[...q.o.map(x=>[x,x]),['Skip','__skip',1]]};}
function topicAns(v,l){S.tans[S.tq]=v==='__skip'?null:l;
 if(S.topic==='mood'&&S.tq===0&&v==='Low or sad')bot('Thank you for telling me. If it ever feels like too much, Tele-MANAS is free on 14416, any time. You can also tap <b>Need help now?</b> at the top.');
 if(S.topic==='periods'&&S.tq===1&&v==='Yes')bot("Bleeding that heavy is worth a doctor's check, as it can lead to low iron.");
 S.tq++;askTopic();}
const restTopics=()=>S.topics.filter(t=>!S.doneT.some(d=>d.topic===t));
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function giveTips(){const T=TOPICS[S.topic];
 bot(`${S.doneT.length?'Thanks.':`Thank you, ${esc(S.name)}.`} ${T.explain}`);S.chat.push({k:'tips',topic:S.topic});
 S.doneT.push({topic:S.topic,tans:S.tans.slice()});
 const rest=restTopics();
 if(rest.length){bot(`You also picked ${andList(rest.map(k=>lc(TOPICS[k].chip)))}. Shall we look at ${TOPICS[rest[0]].short} now?`);return ask('nextTopic');}
 finishChat();}
function finishChat(){S.topic=S.topics[0]||S.topic;
 if(S.consentB==='yes'){bot('Want me to remember what you told me, so I can spot patterns?');ask('save');}
 else{bot("Your health notes are off, so I won't save any of this. You can turn them on in Settings → Privacy.");ask('card');}}
function startChat(){if(!S.topics.length&&S.topic)S.topics=[S.topic];S.topic=S.topics[0]||S.topic;S.doneT=[];S.chat=[];S.ans={};S.tans=[];S.tq=0;S.q=null;S.redFlag=false;S.typing=false;
 if(S.knows===null){bot("Let's work it out together.");ask('period');}
 else if(S.knows==='unsure'){me(KNOWL.unsure);bot("That's okay, we'll work it out together.");ask('period');}
 else{me(KNOWL[S.knows]);bot('Thanks for telling me. One quick check so I get this right.');ask({peri:'bPeri',meno:'bMeno',post:'bPost'}[S.knows]);}
 S.screen='chat';}
function answer(i,sync){const q=S.q;if(!q)return;const o=q.o[i];if(!o)return;me(esc(o[0]));S.q=null;
 const run=()=>{if(q.id==='topic')topicAns(o[1],o[0]);else QS[q.id].on(o[1],o[0]);};
 if(sync){run();return;}
 S.typing=true;render();setTimeout(()=>{S.typing=false;run();render();},520);}
function autoRun(vals){for(const v of vals){if(!S.q)break;let i=S.q.o.findIndex(o=>o[1]===v);if(i<0)i=0;answer(i,true);}}

function buildItems(){const a=S.ans,items=[];
 const pl={regular:'Periods: still regular',changing:'Periods: changing (earlier or later)',gaps:'Periods: gaps of 2 months or more',stopped:`Periods: stopped ${YL[a.years]||'a year or more'} ago`,hormones:'On pills, a coil or hormone treatment'};
 if(S.knows&&S.knows!=='unsure')items.push({t:`${STAGEL[S.knows]} (you told us)${a.years&&YL[a.years]?`, last period ${YL[a.years]} ago`:''}`,said:KNOWL[S.knows]});
 else if(pl[a.period])items.push({t:pl[a.period],said:a.said});
 if(a.op==='ovaries'||a.op==='womb')items.push({t:a.op==='ovaries'?'Operation: ovaries removed':'Operation: womb removed, ovaries kept',said:a.saidOp});
 if(a.bleed==='yes')items.push({t:'Bleeding or spotting after periods stopped',said:'Yes'});
 (S.doneT.length?S.doneT:[{topic:S.topic,tans:S.tans}]).forEach((d,i)=>{const T=TOPICS[d.topic];items.push({t:T.sum(d.tans),said:(i===0&&S.own)||d.tans.filter(Boolean).join(' · ')});});
 return items.slice(0,3).map(x=>({...x,state:null,editing:false,draft:x.t}));}

function computeGroup(){const a=S.ans,ag=age();let g=null,sp=null;S.told=false;S.diag=false;S.corrected=false;S.altNext=0;
 if(a.op==='ovaries')sp='surgery';
 else if(a.op==='womb')sp='womb';
 else if(a.period==='hormones'||a.hormones==='yes')sp='hormones';
 else if(S.knows==='peri'){g='B';S.told=true;}
 else if(S.knows==='meno'){g=['lt1','unsure','op'].includes(a.years)?'D':(a.years==='5+'?'F':'E');S.told=true;}
 else if(S.knows==='post'){g=a.years==='5+'?'F':'E';S.told=true;}
 else if(a.period==='regular')g='pre';
 else if(a.period==='changing')g='B';
 else if(a.period==='gaps')g='C';
 else if(a.period==='stopped')g=a.years==='5+'?'F':'E';
 else sp='notsure';
 if(ag!==null&&ag<40&&g&&g!=='pre'){if(S.told&&a.doctor==='yes')S.diag=true;g='A';}
 S.group=g;S.special=sp;}

function stageInfo(){

 if(g==='A')return S.diag?{t:'Early menopause',sub:'(diagnosed by your doctor)',because:'Because you told us a doctor has confirmed this.',d:'Your chapter'}:null;

 if(S.corrected)st.because='You changed this, so Home has updated to match.';

function guess(t){t=t.toLowerCase();
 const R=[['sleep',/sleep|neend|wake|awake|insomnia/],['hot',/hot|flush|sweat|garmi|heat/],['mood',/tension|angry|anger|worry|mood|sad|cry|irrit|stress|anxious/],['tired',/tired|weak|energy|thak|fatigue|exhaust/],['aches',/ache|pain|joint|knee|back|dard|stiff/],['periods',/period|bleed|mens|cycle|spot|mc/]];
 for(const [k,r] of R)if(r.test(t))return k;return 'whats';}
function preset(k,keep){const P=PRESETS[k],kp={discreet:S.discreet,device:{...S.device}};S=fresh();
 Object.assign(S,{name:P.name,year:P.year,phone:'9876543210',consentA:'yes',consentB:'yes',notifAsked:true,topic:P.topic,topics:[P.topic],knows:P.knows,months:P.months||null,preset:k});
 if(keep){S.discreet=kp.discreet;S.device=kp.device;}
 startChat();autoRun(P.v);
 S.items=buildItems();S.items.forEach(i=>{i.state='yes';});S.saved=S.items.slice();
 computeGroup();S.later=!!P.later;S.checkins=P.later?5:2;S.screen='home';S.tab='home';}
const PRESETS={
 first:{l:'First visit',who:'Meera, 45',name:'Meera',year:1981,topic:'sleep',knows:'unsure',v:['changing','Most nights','Yes, often','A few months']},
 A:{l:'A · Under 40',who:'Priya, 36',name:'Priya',year:1990,topic:'hot',knows:'unsure',v:['gaps','no','3–5','Yes, often','A few months'],later:true},
 B:{l:'B · Early peri',who:'Meera, 44',name:'Meera',year:1982,topic:'sleep',knows:'unsure',v:['changing','Most nights','Sometimes','A few months'],later:true},
 C:{l:'C · Late peri',who:'Kavita, 48',name:'Kavita',year:1978,topic:'hot',knows:'unsure',v:['gaps','3–5','Yes, often','A few months'],later:true},
 D:{l:'D · Around menopause',who:'Sunita, 50',name:'Sunita',year:1976,topic:'mood',knows:'meno',v:['lt1','later','Tension or worry','A little','A few months'],later:true,months:10},
 E:{l:'E · Early post',who:'Lakshmi, 53',name:'Lakshmi',year:1973,topic:'aches',knows:'unsure',v:['stopped','1-2','no','Knees','Yes','A year or more'],later:true},
 F:{l:'F · Later post',who:'Shanta, 60',name:'Shanta',year:1966,topic:'tired',knows:'unsure',v:['stopped','5+','no','Most days','Sometimes','A year or more'],later:true},
 hormones:{l:'On pills, coil or HRT',who:'Anjali, 47',name:'Anjali',year:1979,topic:'mood',knows:'unsure',v:['hormones','Tension or worry','A little','A few months']},
 surgery:{l:'Ovaries removed',who:'Rekha, 44',name:'Rekha',year:1982,topic:'hot',knows:'unsure',v:['surgery','ovaries','3–5','Sometimes','A few months']},
 notsure:{l:'Not sure',who:'Fatima, 46',name:'Fatima',year:1980,topic:'whats',knows:null,v:['unsure','Sleep changes','A little','A few months']},
 red:{l:'Red flag on top',who:'Lakshmi, 53',name:'Lakshmi',year:1973,topic:'aches',knows:'unsure',v:['stopped','1-2','yes','go','Knees','Yes','A year or more'],later:true}
};

/* ---------- actions ---------- */
const ACT={
 go:v=>go(v),
 restart(){S=fresh();go('welcome');},
 samplePhone(){S.phone='98765 43210';render();},
 sendCode(){if(digits(S.phone).length===10)go('code');},
 codeNext(){if(S.otp.length===6)go('about');},
 resend(){S.resendIn=30;toast('New code sent. It only says “Your code is …”.');startCodeTimerOnly();},
 year(v){S.year=+v;render();},
 aboutNext(){if(!S.name.trim()||!S.year)return;if(age()<18){S.name='';S.year=null;go('under18');}else go('consent');},
 consent(v){const [k,a]=v.split(':');S['consent'+k]=a;render();},
 listen(){toast('Reading the notice aloud (works in the app).');},
 sheet(v){S.sheet=v;if(v==='pin')S.pinBuf='';if(v==='bleed')S.bleed={when:null,amt:null};render();},
 closeSheet(){S.sheet=null;render();},
 bio(){S.bio=!S.bio;S.pinSkip=false;render();if(S.bio)toast('Fingerprint on. A PIN is safer if others have a fingerprint saved here.');},
 pinSkip(){S.pinSkip=true;S.pin=false;S.bio=false;render();},
 pk(v){if(v==='del')S.pinBuf=S.pinBuf.slice(0,-1);else if(S.pinBuf.length<4)S.pinBuf+=v;
  if(S.pinBuf.length===4){S.pin=true;S.pinSkip=false;S.sheet=null;S.pinBuf='';render();toast('PIN set. NAARIZE locks about a minute after you leave it.');}else render();},
 notif(v){S.notifAsked=true;S.notifHidden=v==='on';render();},
 disc(v){S.discAsked=true;S.discreet=v==='on';render();},
 src(v){S.device.src=v;render();},
 sw(v){S.device[v]=!S.device[v];render();},
 cc(){toast('Only +91 (India) for now.');},
 pvNotif(){S.notifHidden=!S.notifHidden;S.notifAsked=true;render();},
 pvDisc(){S.discreet=!S.discreet;S.discAsked=true;render();},
 help(){S.sheet='help';S.hosp=false;render();},
 hosp(){S.hosp=!S.hosp;render();},
 tele(){toast('Teleconsult booking opens here. Not part of this prototype.');},
 more(){S.moreOpen=!S.moreOpen;render();},
 topic(v){S.reflect=null;const i=S.topics.indexOf(v);
  if(i>=0)S.topics.splice(i,1);
  else if(S.topics.length>=3){toast('You can pick up to 3. Tap one to remove it.');return;}
  else S.topics.push(v);
  S.topic=S.topics[0]||null;render();},
 topicsGo(){if(!S.topics.length)return;S.topic=S.topics[0];
  if(S.topics.length===1&&S.topic==='whats'){S.knows=null;startChat();render();}else go('stagek');},
 own(){const t=(S.own||'').trim();if(!t){toast('Type a few words first, or pick a topic.');return;}S.reflect=guess(t);render();},
 mic(){toast('Voice input works in the app. Type here for now.');},
 reflectYes(){const k=S.reflect;S.reflect=null;if(!S.topics.includes(k)){if(S.topics.length>=3){toast('You can pick up to 3. Remove one first.');render();return;}S.topics.push(k);}S.topic=S.topics[0];render();},
 reflectNo(){S.reflect=null;render();},
 knows(v){S.knows=v;startChat();render();},
 ans(v){answer(+v);},
 chatSend(){const i=$('#ci'),t=i&&i.value.trim();if(!t)return;me(esc(t));bot(S.q?"Thanks, I've kept your words. To keep this short, please tap one of the answers above, or Skip.":"Thanks, I've noted that.");render();},
 item(v){const [i,s]=v.split(':');S.items[+i].state=s;render();},
 itemEdit(v){const it=S.items[+v];it.editing=true;it.draft=it.t;render();const el=$('#ed'+v);if(el)el.focus();},
 itemEditOk(v){const it=S.items[+v];it.t=(it.draft||'').trim()||it.t;it.editing=false;it.state='yes';render();},
 itemEditCancel(v){S.items[+v].editing=false;render();},
 saveDone(){S.saved=S.items.filter(i=>i.state==='yes');computeGroup();go('stagecard');toast(S.saved.length?`Saved ${S.saved.length} to your Health Story.`:'Nothing saved.');},
 saveSkip(){S.saved=[];computeGroup();go('stagecard');},
 changeTo(v){const ag=age();S.special=v==='notsure'?'notsure':null;S.group=v==='notsure'?null:v;S.told=false;S.diag=false;S.corrected=true;S.altNext=0;S.checkDone=null;S.sheet=null;
  if(ag!==null&&ag<40&&S.group&&S.group!=='pre'){S.group='A';render();toast("Updated. Before 40, the doctor's check stays at the top.");}
  else{render();toast('Updated. Home now matches what you told us.');}},
 toHome(){S.screen='home';S.tab='home';S.sheet=null;render();},
 tab(v){S.tab=v;render();const hb=$('#hb');if(hb&&v!=='talk')hb.scrollTop=0;},
 discreet(){S.discreet=!S.discreet;render();toast(S.discreet?'Discreet mode on. Health words are hidden on Home.':'Discreet mode off.');},
 read(){const nx=S._nx||{};const T=TOPICS[S.topic]||TOPICS.whats;S.article={...nx,tips:nx===T.next?T.tips:null};S.sheet='article';render();},
 readExtra(){S.article={...S._extra};S.sheet='article';render();},
 readLearn(v){const T=TOPICS[S.topic]||TOPICS.whats;const i=+v;S.article=i===0?{...T.next,tips:T.tips}:{...ARTS[learnList()[i-1]],m:'3-minute read'};S.sheet='article';render();},
 else(){S.altNext=(S.altNext||0)+1;render();toast('Here is something else for you.');},
 startPlan(){toast("Great. I'll check in gently this month.");},
 note(){toast('Note started in My Story. Add dates and how you felt.');},
 check(v){S.checkDone=v;S.checkins=Math.min(7,S.checkins+1);S.log.unshift({q:S._ckq,a:v});render();toast('Saved. Thanks for checking in.');},
 checkUndo(){S.checkDone=null;S.checkins=Math.max(1,S.checkins-1);S.log.shift();render();},
 bleedPick(v){const [f,x]=v.split(':');S.bleed[f]=x;render();},
 bleedSave(){const b=S.bleed,txt=`${b.amt.toLowerCase()} ${b.when==='This week'?'this week':b.when.toLowerCase()}`;S.sheet=null;S.log.unshift({q:S.discreet?'Note':'Bleeding',a:`${b.amt}, ${b.when.toLowerCase()}`});
  if(S.special==='hormones'){render();toast('Noted for your doctor.');return;}
  S.redFlag=true;S.bleedLogged=txt;S.tab='home';render();toast('Saved. Please see the note at the top of Home.');},
 redSeen(){S.redFlag=false;S.bleedLogged=null;render();toast("Thanks for letting me know. I've noted it in My Story.");},
 logPeriod(){toast('Period logged. Your cycle lengths update in My Story.');},
 talkSend(){const i=$('#tk'),t=i&&i.value.trim();if(!t)return;me(esc(t));bot("Thanks for telling me. In the full app I'd answer here. This prototype covers the first chat only.");render();},
 yes12(){S.group='E';S.months=12;S.because12="It's been about a year since your last period.";S.told=false;S.corrected=false;S.sheet=null;S.checkDone=null;render();toast('Updated. Any bleeding from now on will be flagged for a doctor.');},
 setDisc(){S.discreet=!S.discreet;render();},
 setNotif(){S.notifHidden=!S.notifHidden;render();},
 setLock(){if(S.pin||S.bio){S.pin=false;S.bio=false;render();toast('App lock off.');}else{S.sheet='pin';S.pinBuf='';render();}},
 setDevice(){const d=S.device;if(d.connected){d.connected=false;render();toast('Disconnected. Nothing more will be read.');}else{d.connected=true;d.sleep=true;d.src=d.src||'Google Health Connect';render();toast('Connected: sleep only. You can add steps later.');}},
 setNotes(){S.consentB=S.consentB==='yes'?'no':'yes';render();toast(S.consentB==='yes'?'Health notes on.':'Health notes off. Nothing new will be saved.');},
 changeNumber(){toast("For safety, I'll ask for your PIN and a new code first.");},
 lk(v){if(v==='del')S.lockBuf=S.lockBuf.slice(0,-1);else if(S.lockBuf.length<4)S.lockBuf+=v;if(S.lockBuf.length===4){S.locked=false;S.lockBuf='';}render();},
 bioUnlock(){S.locked=false;S.lockBuf='';render();}
};
function startCodeTimerOnly(){clearInterval(codeTimer);codeTimer=setInterval(()=>{if(S.screen!=='code'){clearInterval(codeTimer);return;}if(S.resendIn>0){S.resendIn--;const r=$('#resend');if(r){r.disabled=S.resendIn>0;r.textContent=S.resendIn>0?`Resend code in 0:${String(S.resendIn).padStart(2,'0')}`:'Resend code';}}},1000);const r=$('#resend');if(r){r.disabled=true;}}

screenEl.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f){if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();f(el.dataset.v,el);}});
app.addEventListener('input',e=>{const t=e.target,k=t.dataset.i;if(!k)return;
 if(k==='phone'){S.phone=t.value;const b=$('#sendBtn');if(b)b.disabled=digits(S.phone).length!==10;}
 else if(k==='otp'){const v=digits(t.value).slice(0,6);t.value=v;S.otp=v;S.autoFilled=false;updOtp();}
 else if(k==='name'){S.name=t.value;const b=$('#aboutBtn');if(b)b.disabled=!(S.name.trim()&&S.year);}
 else if(k==='own'){S.own=t.value;}
 else if(k==='edit'){S.items[+t.dataset.n].draft=t.value;}});
app.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();ACT[t.dataset.enter](t.value,t);}
 if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});

/* ---------- control rail ---------- */
const JUMPS=[['welcome','Welcome'],['phone','Sign in'],['about','About you'],['consent','Consent'],['private','Keep private'],['brings','What brings you'],['stagek','Your stage'],['chat','First chat'],['save','Save'],['stagecard','Stage card'],['home','Home']];
const curJump=k=>S.screen===k||(k==='phone'&&S.screen==='code')||(k==='about'&&S.screen==='under18');
function jump(v){S.locked=false;S.sheet=null;
 if(['welcome','phone','about','consent','private'].includes(v)){go(v);return;}
 if(!S.name)S.name='Meera';if(!S.year)S.year=1981;if(!S.consentA){S.consentA='yes';S.consentB='yes';}
 if(v==='brings'){go('brings');return;}
 if(v==='stagek'){S.topic=S.topic||'sleep';if(!S.topics.length)S.topics=[S.topic];go('stagek');return;}
 if(v==='chat'){S.topic=S.topic||'sleep';if(!S.topics.length)S.topics=[S.topic];if(S.knows===undefined)S.knows='unsure';startChat();render();return;}
 if(v==='save'){preset('first',true);S.items.forEach(i=>{i.state=null;});S.saved=[];go('save');return;}
 if(v==='stagecard'){preset('first',true);go('stagecard');return;}
 if(v==='home'){if(!S.group&&!S.special)preset('first',true);S.screen='home';S.tab='home';render();}}
const tg=(p,on,l,dis)=>`<button class="trow" role="switch" aria-checked="${!!on}" data-p="${p}" ${dis?'disabled':''}><span>${l}</span><span class="psw"></span></button>`;
function renderPanel(){const view=S.special?SPL[S.special]:S.group?GL[S.group]:'Not set yet';
 panel.innerHTML=`<div><h1>NAARIZE prototype</h1><p class="lede">Tap through onboarding to Home the way she would. Her answers change the path, the stage card and what Home shows.</p></div>
 <section><h2 class="ph">Jump to a screen</h2><div class="plist">${JUMPS.map(([k,l])=>`<button class="pb${curJump(k)?' on':''}" data-p="jump" data-v="${k}" ${curJump(k)?'aria-current="true"':''}>${l}</button>`).join('')}</div></section>
 <section><h2 class="ph">Open Home as</h2><div class="pgrid">${Object.entries(PRESETS).map(([k,P])=>`<button class="pb${S.preset===k&&S.screen==='home'?' on':''}" data-p="preset" data-v="${k}">${P.l}<small>${P.who}</small></button>`).join('')}</div></section>
 <section><h2 class="ph">Try on Home</h2><div class="ptog">${tg('later',S.later,'A later day (patterns noticed)',S.screen!=='home')}${tg('discreet',S.discreet,'Discreet mode')}</div>
 <div class="pact" style="margin-top:8px"><button class="pb" data-p="prompt12" ${S.screen==='home'&&S.group==='D'&&!S.special?'':'disabled'}>Show 12-month prompt</button><button class="pb" data-p="lock">Leave the app</button><button class="pb" data-p="restart">Restart</button></div></section>
 <section><h2 class="ph">Her answers so far</h2><dl class="pstate"><dt>Name</dt><dd>${esc(S.name)||'–'}</dd><dt>Age</dt><dd>${age()??'–'}</dd><dt>Topics</dt><dd>${S.topics.length?S.topics.map(k=>esc(TOPICS[k].chip)).join(' · '):'–'}</dd><dt>Stage</dt><dd>${S.knows===undefined?'–':S.knows===null?'Skipped (not sure path)':esc(KNOWL[S.knows])}</dd><dt>Home</dt><dd>${view}</dd><dt>Red flag</dt><dd>${S.redFlag?'Yes, shown at top':'No'}</dd></dl></section>
 <p class="pnote">Built from the NAARIZE Designer Manual (3 Nov 2026) and the final Penpot screens. Tip copy, red-flag wording and the hospital list need clinical review. Bracketed text is a placeholder.</p>`;}
panel.addEventListener('click',e=>{const el=e.target.closest('[data-p]');if(!el||el.disabled)return;const p=el.dataset.p,v=el.dataset.v;
 if(p==='jump')jump(v);
 else if(p==='preset'){preset(v,true);render();}
 else if(p==='later'){S.later=!S.later;S.checkDone=null;S.altNext=0;render();}
 else if(p==='discreet'){S.discreet=!S.discreet;render();}
 else if(p==='device'){const d=S.device;d.connected=!d.connected;if(d.connected){d.sleep=true;d.src=d.src||'Google Health Connect';}S.checkDone=null;render();}
 else if(p==='prompt12'){S.sheet='prompt12';render();}
 else if(p==='lock'){if(S.pin||S.bio){S.sheet=null;S.locked=true;S.lockBuf='';render();}else toast('Set a PIN in “Keep private” first. Without one, NAARIZE opens straight away.');}
 else if(p==='restart'){clearInterval(codeTimer);S=fresh();go('welcome');}});

/* ---------- fit the phone to the window ---------- */
function fit(){const narrow=innerWidth<900;const w=narrow?document.documentElement.clientWidth-32:innerWidth-32-28-380;const h=narrow?Infinity:innerHeight-48;
 const s=Math.max(.5,Math.min(1,w/418,h/872));document.documentElement.style.setProperty('--s',s.toFixed(3));}
addEventListener('resize',fit);fit();
render();
</script>
</body>
</html>
