<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable NAARIZE prototype: onboarding to Home, built from the designer manual.">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NAARIZE Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the phone sits left, a narrow control rail sits right; they stack on narrow screens.
   Page chrome follows the viewer's theme. The app inside the phone keeps one light look on purpose. */
:root{
  --bg:#E4EAE8;--panel:#FFFFFF;--fg:#17201F;--mut:#53605D;--line:#D0D9D6;--acc:#1D5C57;--acc-fg:#FFFFFF;--soft:#E7EFED;--bezel:#0E1413;
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1312;--panel:#151E1D;--fg:#E4ECEA;--mut:#9DAEAA;--line:#2A3735;--acc:#7CC2B7;--acc-fg:#0D1312;--soft:#1C2826;--bezel:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1312;--panel:#151E1D;--fg:#E4ECEA;--mut:#9DAEAA;--line:#2A3735;--acc:#7CC2B7;--acc-fg:#0D1312;--soft:#1C2826;--bezel:#000000;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px}
.dwrap{width:calc(418px * var(--s,1));height:calc(872px * var(--s,1));flex:none}
.device{width:418px;height:872px;padding:14px;box-sizing:border-box;border-radius:60px;background:var(--bezel);transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 40px 80px -30px rgba(10,30,28,.45)}

/* ---------- control rail ---------- */
.panel{flex:1 1 300px;max-width:380px;min-width:0;display:flex;flex-direction:column;gap:20px;padding-top:4px}
.panel h1{margin:0;font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--mut);font-size:15px;line-height:1.5}
.ph{margin:0 0 8px;font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pb{font:600 14px/1.25 var(--f);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:36px;padding:6px 10px;cursor:pointer;text-align:left}
.pb:hover{border-color:var(--acc)}
.pb.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.pb[disabled]{opacity:.45;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pgrid .pb{display:flex;flex-direction:column;gap:2px}
.pb small{font-weight:500;font-size:12px;opacity:.78}
.ptog{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;background:none;border:0;color:var(--fg);cursor:pointer;width:100%;font:500 14px var(--f);text-align:left;padding:0}
.trow+.trow{border-top:1px solid var(--line)}
.trow[disabled]{opacity:.45;cursor:not-allowed}
.psw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.psw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:var(--panel);transition:transform .15s}
.trow[aria-checked="true"] .psw{background:var(--acc)}
.trow[aria-checked="true"] .psw::after{transform:translateX(16px)}
.pact{display:flex;flex-wrap:wrap;gap:6px}
.pstate{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px;background:var(--soft);border-radius:12px;padding:12px 14px;margin:0}
.pstate dt{color:var(--mut);font:500 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em}
.pstate dd{margin:0;min-width:0}
.pnote{font-size:12.5px;color:var(--mut);line-height:1.5;margin:0}
.panel :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- the app (fixed light look) ---------- */
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:#F4F6F5;color:#1E2A2A;font-family:var(--f);font-size:16px;line-height:1.45;color-scheme:light}
.screen *{box-sizing:border-box}
.screen button,.screen input{font-family:inherit}
.screen :focus-visible{outline:3px solid #E0A12E;outline-offset:2px}
#app{position:absolute;inset:0}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#F4F6F5}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.pad{padding:8px 20px 16px}
.foot{padding:12px 20px 30px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.h1{margin:0;font-size:27px;line-height:1.25;font-weight:700;text-wrap:balance}
.h2{margin:0;font-size:23px;line-height:1.3;font-weight:700;text-wrap:balance}
.h3{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.p{margin:0;font-size:16px;line-height:1.5;color:#3C4847}
.why{margin:0;font-size:15px;line-height:1.45;color:#56615F}
.mut{color:#56615F}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fl{font-size:15px;font-weight:600}
.lbl{margin:0;font:700 12px/1.2 var(--f);letter-spacing:.07em;text-transform:uppercase;color:#56615F}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:14px;font-weight:600;font-size:17px;line-height:1.2;border:1.5px solid #1D5C57;cursor:pointer;text-align:center;text-decoration:none}
.btn-p{background:#1D5C57;color:#FFFFFF}
.btn-p:hover:not([disabled]){background:#174B47}
.btn-s{background:#FFFFFF;color:#1D5C57}
.btn-s:hover:not([disabled]){background:#F1F7F6}
.btn-r{background:#A33A24;border-color:#A33A24;color:#FFFFFF}
.btn-r:hover{background:#8E2F1C}
.btn.sm{min-height:46px;font-size:16px;border-radius:12px;padding:0 12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.tlink{background:none;border:0;padding:0 2px;min-height:44px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;color:#1D5C57;cursor:pointer;text-decoration:none}
.tlink[disabled]{color:#56615F;cursor:default}
.ib0{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1E2A2A;padding:0;flex:none}
.ib1{width:44px;height:44px;border-radius:22px;border:1px solid #DCE3E1;background:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1E2A2A;padding:0}
.ib1.on{background:#1D5C57;border-color:#1D5C57;color:#FFFFFF}
.help{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:#FBE9E4;color:#8E2F1C;font-weight:700;font-size:15px;border:0;cursor:pointer;flex:none}
.help:hover{background:#F7DCD4}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 8px}
.hdr.bb{border-bottom:1px solid #E3E8E7;padding-bottom:10px}
.prog{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg{height:6px;border-radius:3px;background:#DCE3E1}
.seg.on{background:#1D5C57}
.card{background:#FFFFFF;border:1px solid #DCE3E1;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;flex:none}
.ct{margin:0;font-size:18px;line-height:1.35;font-weight:700}
.cp{margin:0;font-size:15px;line-height:1.45;color:#3C4847}
.inp{height:58px;padding:0 16px;border-radius:14px;background:#FFFFFF;border:2px solid #CFD8D6;font-weight:600;font-size:20px;color:#1E2A2A;outline:none;width:100%;min-width:0}
.inp:focus{border-color:#1D5C57}
.inp::placeholder{color:#8A9593;font-weight:500}
.cc{height:58px;padding:0 14px;border-radius:14px;background:#FFFFFF;border:1.5px solid #DCE3E1;display:flex;align-items:center;font-size:19px;font-weight:600;flex:none}
.brand{font-weight:700;font-size:19px;letter-spacing:.14em}
.photo{height:232px;border-radius:24px;background:#DDE8E5;border:1.5px dashed #9DB5B0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#3E5552;text-align:center;padding:0 32px;flex:none}
.photo b{font-size:15px}
.photo span{font-size:13px}
.doc{display:flex;align-items:center;gap:14px;padding:12px 16px}
.avatar{width:52px;height:52px;border-radius:26px;background:#DDE8E5;border:1.5px dashed #9DB5B0;display:flex;align-items:center;justify-content:center;color:#3E5552;flex:none}
.otp{position:relative}
.otp-in{position:absolute;inset:0;width:100%;height:100%;opacity:.01;border:0;z-index:2;font-size:16px;cursor:text}
.otp-boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ob{height:62px;border-radius:14px;background:#FFFFFF;border:1.5px solid #CFD8D6;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.otp:focus-within .ob.cur{border:2px solid #1D5C57}
.warn{display:flex;gap:12px;align-items:center;background:#FCF1DB;border-radius:16px;padding:14px 16px;color:#5C4210;font-size:16px}
.ok-note{display:flex;gap:6px;align-items:center;color:#1D5C57;font-weight:600;font-size:14px}
.years{position:relative;height:232px;overflow-y:auto;background:#FFFFFF;border:1px solid #DCE3E1;border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:2px;flex:none}
.yr{min-height:44px;border:0;background:transparent;border-radius:12px;font-size:19px;color:#56615F;cursor:pointer;flex:none}
.yr:hover{background:#F1F7F6}
.yr.on{background:#E2EEEC;color:#14423E;font-weight:700;font-size:22px}
.hr{height:1px;background:#DCE3E1;flex:none}
.dl{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:10px;row-gap:7px;margin:0;font-size:15px;line-height:1.4}
.dl dt{color:#56615F;font-weight:600}
.dl dd{margin:0}
.note{margin:0;font-size:14px;line-height:1.45;color:#5C4210;background:#FCF1DB;border-radius:12px;padding:10px 12px}
.oi{width:44px;height:44px;border-radius:12px;background:#E2EEEC;color:#1D5C57;display:flex;align-items:center;justify-content:center;flex:none}
.tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:10px;padding:4px 8px;background:#E2EEEC;color:#14423E;flex:none}
.tag.grey{background:#E7EBEA;color:#56615F}
.ot{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.od{margin:2px 0 0;font-size:15px;line-height:1.4;color:#56615F}
.src{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:14px;border:1.5px solid #DCE3E1;background:#FFFFFF;font-weight:600;font-size:16px;color:#1E2A2A;text-align:left;cursor:pointer;width:100%}
.src.on{border-color:#1D5C57;background:#F1F7F6}
.logo-ph{width:28px;height:28px;border-radius:8px;background:#DDE8E5;border:1px dashed #9DB5B0;flex:none}
.sw{width:52px;height:30px;border-radius:15px;background:#BFCAC7;border:0;position:relative;cursor:pointer;padding:0;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;transition:transform .15s}
.sw[aria-checked="true"]{background:#1D5C57}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;font-size:16px}
.swrow+.swrow{border-top:1px solid #E7EBEA}
.chip{display:flex;flex-direction:column;gap:3px;justify-content:center;min-height:84px;padding:12px 14px;border-radius:16px;border:1.5px solid #CFD8D6;background:#FFFFFF;text-align:left;cursor:pointer;color:#1E2A2A}
.chip b{font-size:16px;line-height:1.3}
.chip small{font-size:14px;color:#56615F;line-height:1.3}
.chip:hover{border-color:#1D5C57}
.chip.on{border:2px solid #1D5C57;background:#E2EEEC}
.chip.more{border-style:dashed}
.chip.more b{display:flex;align-items:center;gap:4px}
.inbar{display:flex;align-items:center;gap:4px;background:#FFFFFF;border:1.5px solid #CFD8D6;border-radius:28px;padding:4px 4px 4px 18px}
.inbar input{flex:1;min-width:0;height:46px;border:0;outline:none;font-size:17px;background:transparent;color:#1E2A2A}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:#1D5C57;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.ib.send{background:#1D5C57;color:#FFFFFF}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;padding:0 18px;border-radius:16px;border:1.5px solid #1D5C57;background:#FFFFFF;color:#1D5C57;font-weight:700;font-size:18px;line-height:1.3;text-align:left;cursor:pointer;width:100%}
.st:hover{background:#F1F7F6}
.st.on{background:#1D5C57;color:#FFFFFF}
.picked{align-self:flex-start;display:flex;gap:8px;align-items:center;background:#E2EEEC;color:#14423E;border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 20px 20px}
.bot{margin:0;background:#FFFFFF;border:1px solid #DCE3E1;border-radius:6px 20px 20px 20px;padding:12px 16px;font-size:17px;line-height:1.45;max-width:310px;align-self:flex-start}
.me{margin:0;background:#1D5C57;color:#FFFFFF;border-radius:20px 6px 20px 20px;padding:10px 16px;font-size:17px;line-height:1.4;align-self:flex-end;max-width:270px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:46px;padding:8px 16px;border-radius:23px;border:1.5px solid #1D5C57;background:#FFFFFF;color:#1D5C57;font-weight:600;font-size:16px;line-height:1.3;text-align:left;cursor:pointer}
.opt:hover{background:#F1F7F6}
.opt.q{border-color:#B9C4C2;color:#3C4847}
.qn{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#56615F;margin-top:4px}
.dot{width:8px;height:8px;border-radius:4px;background:#C9D2D0}
.dot.on{background:#1D5C57}
.typing{display:flex;gap:5px;padding:16px 18px}
.typing span{width:8px;height:8px;border-radius:4px;background:#9DB0AC;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
.inbar2{padding:10px 16px 28px;background:#FFFFFF;border-top:1px solid #E3E8E7;display:flex;align-items:center;gap:6px}
.inbar2 input{flex:1;min-width:0;height:48px;border-radius:24px;border:1.5px solid #CFD8D6;padding:0 16px;font-size:17px;background:#F4F6F5;color:#1E2A2A;outline:none}
.inbar2 input:focus{border-color:#1D5C57}
.rf{background:#FFFFFF;border:2px solid #A33A24;border-radius:20px;overflow:hidden;flex:none}
.rfh{background:#FBE9E4;padding:12px 16px;display:flex;gap:12px;align-items:center}
.rfi{width:36px;height:36px;border-radius:18px;background:#A33A24;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none}
.rfh h2{margin:0;font-size:17px;line-height:1.3;font-weight:700;color:#6E2414}
.rfb{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px}
.rfb p{margin:0;font-size:15px;line-height:1.45;color:#3C4847}
.tip{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.45}
.num{width:28px;height:28px;border-radius:14px;background:#FCF1DB;color:#7A5410;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.rev{display:flex;align-items:center;gap:8px;font-size:13px;color:#56615F;border-top:1px solid #E7EBEA;padding-top:10px}
.item.on{border:2px solid #1D5C57}
.item.off{opacity:.6}
.said{margin:0;font-size:15px;color:#56615F;font-style:italic}
.tl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tl i{height:10px;border-radius:5px;background:#DCE3E1}
.tl i.on{background:#1D5C57}
.tlt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:12px;line-height:1.25;color:#56615F;text-align:center}
.tlt .on{color:#14423E;font-weight:700}
.hh{padding:16px 20px 4px;display:flex;flex-direction:column;gap:10px}
.dzl{margin:0;font-size:14px;color:#56615F;display:flex;gap:6px;align-items:center}
.dzl span{width:8px;height:8px;border-radius:4px;background:#1D5C57}
.hb{padding:10px 20px 18px;gap:12px}
.stage{background:#E2EEEC;border-color:#E2EEEC}
.stage .lbl{color:#3E5552}
.stage .ct{color:#14423E}
.stage .cp{color:#2F4A47}
.sub{font-weight:500;color:#3E5552}
.sth{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stage.sm{padding:10px 14px;gap:6px}
.stage.sm .ct{font-size:16px}
.chg{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#FFFFFF;border:1px solid #B9CFCB;color:#1D5C57;font-weight:600;font-size:15px;cursor:pointer;flex:none}
.att{background:#FCF1DB;border-color:#EFD69B}
.att .ct,.att .cp{color:#4A3306}
.atti{width:36px;height:36px;border-radius:18px;background:#F2B544;color:#3D2A05;display:flex;align-items:center;justify-content:center;flex:none}
.meta{font-size:14px;color:#56615F;margin-top:-4px}
.ansg{display:grid;gap:8px}
.ans{min-height:46px;border-radius:12px;border:1.5px solid #CFD8D6;background:#FFFFFF;color:#1E2A2A;font-weight:600;font-size:15px;line-height:1.25;padding:6px 8px;cursor:pointer}
.ans:hover{border-color:#1D5C57}
.go{display:flex;align-items:center;gap:8px;min-height:44px;border:0;border-top:1px solid #E7EBEA;background:transparent;padding:6px 0 0;font-weight:600;font-size:15px;color:#1D5C57;cursor:pointer;text-align:left;width:100%}
.stage .go{border-top-color:#C4D6D2}
.go b{color:#1E2A2A}
.pd{display:flex;gap:6px}
.pd i{width:14px;height:14px;border-radius:7px;background:#DCE3E1}
.pd i.on{background:#F2B544}
.ntc{background:#FCF1DB;border-color:#F0DCAA}
.ntc .lbl,.ntc .pnp{color:#5C4210}
.ntc .ct{font-size:16px;font-weight:600;line-height:1.45}
.pnp{margin:0;font-size:13px;font-style:italic}
.mb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.mb i{height:8px;border-radius:4px;background:#C4D6D2}
.mb i.on{background:#1D5C57}
.watch{display:flex;align-items:center;gap:12px;background:#F1F7F6;border-radius:14px;padding:10px 12px}
.strong{border:2px solid #1D5C57}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #DCE3E1;padding:6px 8px 24px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;font-weight:600;font-size:13px;color:#56615F;background:none;border:0;cursor:pointer}
.tab .pill{width:60px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#14423E}
.tab.on .pill{background:#E2EEEC}
.big .ct{font-size:20px}
.big .ans{min-height:54px;font-size:17px}
.big .cp{font-size:16px}
.big .h1{font-size:28px}
.ov{position:absolute;inset:0;background:rgba(18,28,27,.55);border:0;width:100%;padding:0;cursor:pointer;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:#F4F6F5;border-radius:28px 28px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px;z-index:21;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#C9D2D0;align-self:center;flex:none}
.emg{background:#FBE9E4;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.emh{color:#8E2F1C;font-size:16px}
.call{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:14px;background:#A33A24;color:#FFFFFF;font-weight:700;font-size:18px;text-decoration:none}
.call:hover{background:#8E2F1C;color:#FFFFFF}
.call small{font-weight:500;font-size:12px}
.hrow{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 14px;border-radius:16px;border:1px solid #DCE3E1;background:#FFFFFF;text-align:left;cursor:pointer;width:100%;color:#1E2A2A;text-decoration:none;font-size:16px}
.hrow:hover{border-color:#1D5C57;color:#1E2A2A}
.hrow small{font-size:14px}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:280px;align-self:center}
.key{min-height:60px;border-radius:30px;border:0;background:#FFFFFF;font-size:24px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1px #DCE3E1;color:#1E2A2A;display:flex;align-items:center;justify-content:center}
.key:hover{background:#F1F7F6}
.key.blank{visibility:hidden}
.pdots{display:flex;gap:14px;justify-content:center}
.pdots i{width:16px;height:16px;border-radius:8px;border:2px solid #1D5C57}
.pdots i.on{background:#1D5C57}
.lock{position:absolute;inset:0;z-index:40;background:#F4F6F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 40px}
.toast{position:absolute;left:20px;right:20px;bottom:104px;z-index:50;background:#1E2A2A;color:#FFFFFF;border-radius:14px;padding:12px 16px;font-size:15px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.slist li{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.4}
.slist li .ico{color:#1D5C57;margin-top:1px}
.cyc{display:flex;gap:8px;flex-wrap:wrap}
.cyc span{background:#E2EEEC;color:#14423E;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px}
.art{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer;width:100%;background:none;border:0;padding:0;min-height:44px;color:#1E2A2A}
.art .ico{color:#1D5C57}
.chosen{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.typing span{animation:none}.sw,.sw::after,.psw,.psw::after{transition:none}}

const QS={
 period:{t:'To give you the right information: <b>how are your periods these days?</b>',
  o:[['Still regular','regular'],['Changing: earlier, later or heavier','changing'],['Gaps of 2 months or more','gaps'],['Stopped for a year or more','stopped'],['Stopped after an operation','surgery'],["On pills, a coil or hormone treatment, so I can't tell",'hormones'],["Not sure / I'd rather not say",'unsure',1]],
  on(v,l){S.ans.period=v;S.ans.said=l;
   if(v==='stopped')return ask('howLong');
   if(v==='surgery')return ask('operation');
   if(v==='hormones')bot("Your treatment can hide period changes, so we'll go by how you're feeling.");
   if(v==='unsure')bot("That's okay, we'll work it out together.");
   afterPeriod();}},
 howLong:{t:'About how long ago?',o:[['1–2 years','1-2'],['3–5 years','3-5'],['More than 5','5+']],on(v){S.ans.years=v;afterPeriod();}},
 operation:{t:'Which operation?',o:[['Womb removed, ovaries kept','womb'],['Ovaries removed','ovaries'],['Not sure','unsure',1]],
  on(v,l){S.ans.op=v;S.ans.saidOp=l;
   if(v==='womb')bot("Thanks. Without a womb, periods can't tell us much, so we'll go by how you feel.");
   if(v==='ovaries')bot('Thank you. Removing the ovaries brings on menopause straight away. A doctor can help with what comes next.');
   if(S.knows&&S.knows!=='unsure')ask('doctor');else afterPeriod();}},
 bPeri:{t:'Are you on any pills, a coil or hormone treatment right now?',o:[['No','no'],['Yes','yes'],['Not sure','unsure',1]],
  on(v){S.ans.hormones=v;if(v==='yes')bot("Thanks. Your treatment can hide period changes, so we'll go by how you're feeling.");ask('doctor');}},
 bMeno:{t:'About how long ago was your last period?',o:[['Less than a year','lt1'],['1–2 years','1-2'],['More than 2 years','2+'],['After an operation','op'],['Not sure','unsure',1]],
  on(v){S.ans.years=v;if(v==='op')ask('operation');else ask('doctor');}},
 bPost:{t:'About how long ago was your last period?',o:[['1–2 years','1-2'],['3–5 years','3-5'],['More than 5 years','5+'],['After an operation','op'],['Not sure','unsure',1]],
  on(v){S.ans.years=v;if(v==='op')ask('operation');else ask('doctor');}},
 doctor:{t:'Has a doctor talked to you about this?',o:[['Yes','yes'],['No','no'],["Not yet, but I'd like to",'later']],
  on(v){S.ans.doctor=v;if(v==='later')bot("Good idea. I'll help you get ready for that visit.");afterPeriod();}},
 bleed:{t:'Any bleeding or spotting since then?',o:[['Yes','yes'],['No','no'],['Not sure','unsure',1]],
  on(v){S.ans.bleed=v;
   if(v==='yes'){S.redFlag=true;S.chat.push({k:'red'});bot(`When you're ready, I can keep going with your questions about ${TOPICS[S.topic].short}.`);return ask('cont');}
   afterSafety();}},
 cont:{t:null,o:[['Keep going','go']],on(){afterSafety();}},
 under40:{t:"Changes like these before 40 are worth a doctor's check. Has a doctor looked into this?",o:[['Yes','yes'],['No','no'],['Not yet','later']],
  on(v){S.ans.u40=v;if(v!=='yes')bot("I'll keep this at the top of your Home, so it's easy to book.");startTopic();}},
 save:{t:null,o:[['Review what to save','save']],on(){S.items=buildItems();S.screen='save';}},
 card:{t:null,o:[['See where you might be','card']],on(){computeGroup();S.screen='stagecard';}}
};
function afterPeriod(){const a=S.ans,y=a.years;
 const stopped=a.period==='stopped'||(S.knows==='meno'&&(y==='1-2'||y==='2+'))||(S.knows==='post'&&['1-2','3-5','5+'].includes(y));
 if(stopped&&!a.bleed)return ask('bleed');
 afterSafety();}
function afterSafety(){const a=S.ans,ag=age();
 const changes=(a.period&&!['regular','unsure','hormones'].includes(a.period))||(S.knows&&S.knows!=='unsure');
 if(ag!==null&&ag<40&&changes&&!a.u40&&a.doctor!=='yes')return ask('under40');
 startTopic();}
function startTopic(){const T=TOPICS[S.topic];bot(`Thanks, that helps. Now 3 quick questions about ${T.short}, then I'll share what may help.`);S.tq=0;askTopic();}
function askTopic(){const T=TOPICS[S.topic];if(S.tq>=3)return giveTips();
 const q=T.qs[S.tq];S.chat.push({k:'prog',n:S.tq+1});bot(q.q);S.q={id:'topic',o:[...q.o.map(x=>[x,x]),['Skip','__skip',1]]};}
function topicAns(v,l){S.tans[S.tq]=v==='__skip'?null:l;
 if(S.topic==='mood'&&S.tq===0&&v==='Low or sad')bot('Thank you for telling me. If it ever feels like too much, Tele-MANAS is free on 14416, any time. You can also tap <b>Need help now?</b> at the top.');
 if(S.topic==='periods'&&S.tq===1&&v==='Yes')bot("Bleeding that heavy is worth a doctor's check, as it can lead to low iron.");
 S.tq++;askTopic();}
function giveTips(){const T=TOPICS[S.topic];
 bot(`Thank you, ${esc(S.name)}. ${T.explain}`);S.chat.push({k:'tips'});
 if(S.consentB==='yes'){bot('Want me to remember what you told me, so I can spot patterns?');ask('save');}
 else{bot("Your health notes are off, so I won't save any of this. You can turn them on in Settings → Privacy.");ask('card');}}
function startChat(){S.chat=[];S.ans={};S.tans=[];S.tq=0;S.q=null;S.redFlag=false;S.typing=false;
 if(S.knows===null){bot("Let's work it out together.");ask('period');}
 else if(S.knows==='unsure'){me(KNOWL.unsure);bot("That's okay, we'll work it out together.");ask('period');}
 else{me(KNOWL[S.knows]);bot('Thanks for telling me. One quick check so I get this right.');ask({peri:'bPeri',meno:'bMeno',post:'bPost'}[S.knows]);}
 S.screen='chat';}
function answer(i,sync){const q=S.q;if(!q)return;const o=q.o[i];if(!o)return;me(esc(o[0]));S.q=null;
 const run=()=>{if(q.id==='topic')topicAns(o[1],o[0]);else QS[q.id].on(o[1],o[0]);};
 if(sync){run();return;}
 S.typing=true;render();setTimeout(()=>{S.typing=false;run();render();},520);}
function autoRun(vals){for(const v of vals){if(!S.q)break;let i=S.q.o.findIndex(o=>o[1]===v);if(i<0)i=0;answer(i,true);}}

function buildItems(){const a=S.ans,items=[];
 const pl={regular:'Periods: still regular',changing:'Periods: changing (earlier or later)',gaps:'Periods: gaps of 2 months or more',stopped:`Periods: stopped ${YL[a.years]||'a year or more'} ago`,hormones:'On pills, a coil or hormone treatment'};
 if(S.knows&&S.knows!=='unsure')items.push({t:`${STAGEL[S.knows]} (you told us)${a.years&&YL[a.years]?`, last period ${YL[a.years]} ago`:''}`,said:KNOWL[S.knows]});
 else if(pl[a.period])items.push({t:pl[a.period],said:a.said});
 if(a.op==='ovaries'||a.op==='womb')items.push({t:a.op==='ovaries'?'Operation: ovaries removed':'Operation: womb removed, ovaries kept',said:a.saidOp});
 if(a.bleed==='yes')items.push({t:'Bleeding or spotting after periods stopped',said:'Yes'});
 const T=TOPICS[S.topic];items.push({t:T.sum(S.tans),said:S.own||S.tans.filter(Boolean).join(' · ')});
 return items.slice(0,3).map(x=>({...x,state:null,editing:false,draft:x.t}));}

function computeGroup(){const a=S.ans,ag=age();let g=null,sp=null;S.told=false;S.diag=false;S.corrected=false;S.altNext=0;
 if(a.op==='ovaries')sp='surgery';
 else if(a.op==='womb')sp='womb';
 else if(a.period==='hormones'||a.hormones==='yes')sp='hormones';
 else if(S.knows==='peri'){g='B';S.told=true;}
 else if(S.knows==='meno'){g=['lt1','unsure','op'].includes(a.years)?'D':(a.years==='5+'?'F':'E');S.told=true;}
 else if(S.knows==='post'){g=a.years==='5+'?'F':'E';S.told=true;}
 else if(a.period==='regular')g='pre';
 else if(a.period==='changing')g='B';
 else if(a.period==='gaps')g='C';
 else if(a.period==='stopped')g=a.years==='5+'?'F':'E';
 else sp='notsure';
 if(ag!==null&&ag<40&&g&&g!=='pre'){if(S.told&&a.doctor==='yes')S.diag=true;g='A';}
 S.group=g;S.special=sp;}

function stageInfo(){
 if(S.special)return SPECIAL[S.special].stage;
 const g=S.group;
 if(g==='A')return S.diag?{t:'Early menopause',sub:'(diagnosed by your doctor)',because:'Because you told us a doctor has confirmed this.',d:'Your chapter'}:null;
 const st={...GROUPS[g].stage};
 if(S.told){st.t=STAGEL[S.knows];st.sub='(you told us)';if(g==='B')st.because='You can change this anytime.';}
 if(g==='D')st.because=`It's been ${S.months?'about '+S.months+' months':'less than a year'}. At 12 months, this is called menopause.`;
 if(g==='E'||g==='F')st.because=S.because12||(g==='F'?"It's been more than 5 years since your last period.":S.ans.years==='3-5'?"It's been about 3–5 years since your last period.":"It's been about 1–2 years since your last period.");
 if(S.corrected)st.because='You changed this, so Home has updated to match.';
 return st;}
const isDoctorCard=()=>S.group==='A'&&!S.special&&!S.diag;
const learnList=()=>cfg().learn||[];

 ${S.reflect?`<section class="card" style="border:2px solid #1D5C57"><p class="cp">You said: <i>“${esc(S.own)}”</i></p><h2 class="ct">It sounds like this is about ${esc(lc(TOPICS[S.reflect].chip))}. Is that right?</h2><div class="g2"><button class="btn btn-s sm" data-a="reflectYes">Yes, that's it</button><button class="btn btn-s sm" data-a="reflectNo">Pick a topic</button></div></section>`:''}
</div><div class="foot" style="gap:8px"><label for="own" class="fl">Or tell me in your own words</label><div class="inbar"><input id="own" placeholder="Type or speak…" value="${esc(S.own)}" data-i="own" data-enter="own"><button class="ib" aria-label="Speak" data-a="mic">${ic('mic')}</button><button class="ib send" aria-label="Send" data-a="own">${ic('send')}</button></div></div></div>`;

 <div class="picked">${ic('check',18)}You picked: ${esc(TOPICS[S.topic]?.chip||'')}</div>
 <div class="stack" style="gap:6px"><p class="p" style="color:#56615F;font-weight:600;font-size:17px">Thanks.</p><h1 class="h1" style="font-size:26px">Do you already know where you are in this stage of life?</h1></div>
 <div class="stack" style="gap:12px">${['peri','meno','post','unsure'].map(k=>`<button class="st" data-a="knows" data-v="${k}">${KNOWL[k]}${ic('chev')}</button>`).join('')}</div>
 <p class="why center" style="margin-top:auto">You can change this anytime.</p>

function redChat(){return `<section class="rf"><div class="rfh"><span class="rfi">${ic('user',20)}</span><h2>Please see a gynaecologist within 1–2 weeks</h2></div><div class="rfb"><p>Any bleeding after periods have stopped for a year needs a doctor's check. Often it's nothing serious, but it's important to find out.</p><button class="btn btn-r" data-a="tele">Find a gynaecologist</button></div></section>`;}
function tipsCard(){const T=TOPICS[S.topic];return `<section class="card" style="gap:12px"><h2 class="ct">${T.tips.length} things that may help</h2>${T.tips.map((t,i)=>`<div class="tip"><span class="num">${i+1}</span><span>${t}</span></div>`).join('')}<div class="rev">${ic('shield',16)}Reviewed by Dr. [Name], MD</div></section>`;}
const progRow=n=>`<div class="qn">${[1,2,3].map(i=>`<i class="dot${i<=n?' on':''}"></i>`).join('')}Question ${n} of 3</div>`;
function msg(m){if(m.k==='red')return redChat();if(m.k==='tips')return tipsCard();if(m.k==='prog')return progRow(m.n);return `<p class="${m.who}">${m.t}</p>`;}
SCR.chat=()=>`<div class="scr"><header class="hdr bb"><div class="row" style="gap:4px">${backBtn(S.knows===null?'brings':'stagek')}<div class="stack"><b style="font-size:17px">NAARIZE</b><span class="why" style="font-size:13px">AI guide · not a doctor</span></div></div>${helpBtn()}</header>
 <div class="log" id="log" role="log" aria-live="polite">${S.chat.map(msg).join('')}${S.typing?'<div class="bot typing" aria-label="NAARIZE is typing"><span></span><span></span><span></span></div>':''}${S.q?`<div class="opts" role="group" aria-label="Answers">${S.q.o.map((o,i)=>`<button class="opt${o[2]?' q':''}" data-a="ans" data-v="${i}">${o[0]}</button>`).join('')}</div>`:''}</div>
 <div class="inbar2"><label for="ci" class="sr">Message</label><input id="ci" placeholder="Or type your answer…" data-enter="chatSend"><button class="ib" aria-label="Send" data-a="chatSend">${ic('send')}</button></div></div>`;

function itemCard(it,i){const st=it.state;
 return `<section class="card item${st==='yes'?' on':''}${st==='no'?' off':''}" style="gap:10px"><div class="row sb" style="gap:10px;align-items:flex-start">${it.editing?`<label class="sr" for="ed${i}">Edit item</label><input id="ed${i}" class="inp" style="height:48px;font-size:16px" value="${esc(it.draft)}" data-i="edit" data-n="${i}">`:`<h2 class="ot">${esc(it.t)}</h2>`}${st==='yes'?`<span class="tag">${ic('check',14)} Saved</span>`:st==='no'?'<span class="tag grey">Not saved</span>':''}</div>
 ${it.said?`<p class="said">You said: “${esc(it.said)}”</p>`:''}
 ${it.editing?`<div class="g2"><button class="btn btn-p sm" data-a="itemEditOk" data-v="${i}">Save change</button><button class="btn btn-s sm" data-a="itemEditCancel" data-v="${i}">Cancel</button></div>`:
 `<div class="g3"><button class="btn sm ${st==='yes'?'btn-p':'btn-s'}" aria-pressed="${st==='yes'}" data-a="item" data-v="${i}:yes">Yes</button><button class="btn sm btn-s" data-a="itemEdit" data-v="${i}">${ic('edit',18)}Edit</button><button class="btn sm ${st==='no'?'btn-p':'btn-s'}" aria-pressed="${st==='no'}" data-a="item" data-v="${i}:no">No</button></div>`}</section>`;}
SCR.save=()=>`<div class="scr">${hdrHelp('chat')}<div class="body pad" style="gap:14px">
 <div class="stack" style="gap:6px"><h1 class="h1" style="font-size:26px">Save to your Health Story?</h1><p class="p">Check each one. I only save what you say yes to.</p></div>
 ${S.items.map(itemCard).join('')}
 <p class="why center" style="font-size:14px">Up to 3 at a time. You can change these anytime in My Story.</p>
</div><div class="foot"><button class="btn btn-p" data-a="saveDone">Done</button><button class="btn btn-s" data-a="saveSkip">Not now</button></div></div>`;

SCR.stagecard=()=>{const st=stageInfo(),g=S.group;
 let card;
 if(isDoctorCard())card=`<section class="card att" style="gap:14px;padding:22px 20px"><div class="row" style="gap:10px"><span class="atti">${ic('user',20)}</span><h1 class="ct" style="font-size:24px">Worth a doctor's check</h1></div><p class="cp" style="font-size:16px">Changes like these before 40 are worth looking into. A simple blood test can help explain them. I won't guess a stage.</p><div class="g2"><button class="btn btn-p sm" data-a="tele">Book a teleconsult</button><button class="btn btn-s sm" data-a="sheet" data-v="change">Change my answers</button></div></section>`;
 else card=`<section class="card" style="gap:16px;padding:22px 20px;border-radius:24px"><span class="lbl">Where you might be right now</span><div><h1 class="h1" style="font-size:30px;color:#14423E">${st.t}</h1>${st.sub?`<p class="p" style="color:#56615F;margin-top:4px">${st.sub}</p>`:''}</div>
  ${st.tl!==undefined&&!S.special?`<div role="img" aria-label="Stage ${st.tl+1} of 5" class="stack" style="gap:8px"><div class="tl">${[0,1,2,3,4].map(i=>`<i class="${i===st.tl?'on':''}"></i>`).join('')}</div><div class="tlt">${['Before changes','Periods changing','Later in the transition','Last period','After'].map((l,i)=>`<span class="${i===st.tl?'on':''}">${l}</span>`).join('')}</div></div>`:''}
  <div class="stack" style="gap:8px;border-top:1px solid #E7EBEA;padding-top:14px"><p class="p">${st.because||''}</p>${!S.special&&g!=='A'&&!S.told?'<p class="p">This is a natural stage, and many women notice changes like these.</p>':''}</div>
  <div class="g2"><button class="btn btn-s sm" data-a="sheet" data-v="change">${ic('edit',18)}Change this</button><button class="btn btn-s sm" data-a="sheet" data-v="means">What this means</button></div></section>`;
 const saved=S.consentB==='yes'&&S.saved.length;
 return `<div class="scr"><header class="hdr"><span class="row why" style="gap:6px;font-weight:600;color:#14423E">${saved?ic('check',20)+'Saved to your Health Story':''}</span>${helpBtn()}</header><div class="body pad" style="justify-content:center;gap:14px">
 ${S.redFlag?`<p class="note" style="background:#FBE9E4;color:#6E2414">Remember: please see a gynaecologist within 1–2 weeks about the bleeding. It will stay at the top of Home.</p>`:''}${card}</div>
 <div class="foot"><button class="btn btn-p" data-a="toHome">Go to Home</button></div></div>`;};

/* ---------- home ---------- */
function stageCardH(){const st=stageInfo(),dz=S.discreet,c=cfg();
 return `<section class="card stage${st.small?' sm':''}"><p class="lbl">${dz?'Where you are':'Where you might be right now'}</p>
 <div class="sth"><h2 class="ct">${dz?st.d:st.t}${!dz&&st.sub?` <span class="sub">${st.sub}</span>`:''}</h2><button class="chg" data-a="sheet" data-v="change">Change this</button></div>
 ${S.group==='D'&&!S.special&&!dz?`<div class="mb" role="img" aria-label="${S.months||'Under 12'} of 12 months without a period">${Array.from({length:12},(_,i)=>`<i class="${i<(S.months||6)?'on':''}"></i>`).join('')}</div>`:''}
 ${st.days?`<div class="row" style="gap:10px"><div class="mb" style="flex:1;grid-template-columns:repeat(7,minmax(0,1fr))" role="img" aria-label="Day 2 of 7">${Array.from({length:7},(_,i)=>`<i class="${i<2?'on':''}"></i>`).join('')}</div><span style="font-size:14px;font-weight:600;color:#2F4A47">Day 2 of 7</span></div>`:''}
 ${!dz&&st.because?`<p class="cp">${st.because}</p>`:''}
 ${c.bleedLog&&!S.special?`<button class="go" data-a="sheet" data-v="bleed">${ic('plus',20)}${dz?'Add a note':'Log any bleeding'}</button>`:''}</section>`;}
function doctorCard(){const dz=S.discreet;
 return `<section class="card att"><div class="row" style="gap:10px"><span class="atti">${ic('user',20)}</span><h2 class="ct">${dz?'A check-up is worth booking':"Worth a doctor's check"}</h2></div><p class="cp">${dz?'Open My Story to see why.':'Changes like these before 40 are worth looking into. A simple blood test can help explain them.'}</p><div class="g2"><button class="btn btn-p sm" data-a="tele">Book a teleconsult</button><button class="btn btn-s sm" data-a="sheet" data-v="change">Change my answers</button></div></section>`;}
function redCardH(){const dz=S.discreet;
 return `<section class="rf"><div class="rfh"><span class="rfi">${ic('user',20)}</span><h2>${dz?'Please book a check-up within 1–2 weeks':'Please see a gynaecologist within 1–2 weeks'}</h2></div><div class="rfb"><p>${dz?'Open My Story to see why.':S.bleedLogged?`You logged ${esc(S.bleedLogged)}. After periods have stopped, any bleeding needs a doctor's check.`:"You told me about bleeding after your periods stopped. That needs a doctor's check."}</p><button class="btn btn-r sm" data-a="tele">Book a teleconsult</button><button class="tlink" style="align-self:flex-start" data-a="redSeen">I've seen a doctor</button></div></section>`;}
function nextCard(nx){const dz=S.discreet,t=dz&&nx.d?nx.d:nx.t;S._nx=nx;
 if(nx.btn)return `<section class="card${nx.strong?' strong':''}"><p class="lbl">Your next step</p><h2 class="ct">${t}</h2><button class="btn btn-p sm" data-a="${nx.act||'tele'}">${nx.btn}</button></section>`;
 if(nx.btns)return `<section class="card"><p class="lbl">Your next step</p><h2 class="ct">${t}</h2><div class="g2"><button class="btn btn-s sm" data-a="startPlan">Start</button><button class="btn btn-s sm" data-a="else">Not now</button></div></section>`;
 return `<section class="card"><p class="lbl">Your next step</p><h2 class="ct">${t}</h2>${nx.m?`<span class="meta">${nx.m}</span>`:''}<div class="g2"><button class="btn btn-p sm" data-a="read">Read now</button><button class="btn btn-s sm" data-a="else">Something else</button></div></section>`;}
function cycleRow(){const c=cfg();if(S.special||!c.cycle)return '';return `<button class="go" data-a="tab" data-v="story">${S.discreet?'Tracker':'Cycle tracker'} · <b>${c.cycle}</b><span style="margin-left:auto">${ic('chev',20)}</span></button>`;}
function checkCard(ck){const lbl=ck.label||'Quick check-in',dz=S.discreet,q=dz&&ck.d?ck.d:ck.q;S._ckq=q;
 const bleedNote=S.special==='hormones'?`<button class="go" data-a="sheet" data-v="bleed">${ic('plus',20)}${dz?'Add a note':'Note any bleeding'} <span class="mut" style="font-weight:400">· kept for your doctor</span></button>`:'';
 if(S.checkDone)return `<section class="card"><p class="lbl">${lbl}</p><div class="row" style="gap:8px;color:#1D5C57">${ic('check')}<b>Saved for today</b></div><p class="cp">${esc(q)} You said: <b>${esc(S.checkDone)}</b></p><button class="tlink" style="align-self:flex-start" data-a="checkUndo">Change answer</button>${cycleRow()}${bleedNote}</section>`;
 const n=ck.o.length;
 return `<section class="card"><p class="lbl">${lbl}</p><h2 class="ct">${q}</h2><div class="ansg" style="grid-template-columns:repeat(${n===4?2:n},minmax(0,1fr))">${ck.o.map(o=>`<button class="ans" data-a="check" data-v="${esc(o)}">${o}</button>`).join('')}</div>${cycleRow()}${bleedNote}</section>`;}
function deviceCard(){S._ckq='How did your sleep feel?';
 if(S.checkDone)return checkCard({q:'How did your sleep feel?',o:[]});
 return `<section class="card strong"><p class="lbl">Quick check-in</p><div class="watch"><span class="oi" style="width:40px;height:40px">${ic('watch')}</span><div class="stack"><span class="why" style="font-size:14px">Your watch</span><b style="font-size:20px">6 h 10 min sleep</b></div></div><h2 class="ct">How did it feel?</h2><div class="ansg" style="grid-template-columns:repeat(4,minmax(0,1fr))">${['Rested','Okay','Tired','Very tired'].map(o=>`<button class="ans" style="padding:6px 2px" data-a="check" data-v="${o}">${o}</button>`).join('')}</div></section>`;}
function patternCard(){const dz=S.discreet,n=S.checkins;
 return `<section class="card"><h2 class="ct" style="font-size:17px">${n>=7?(dz?'Your first insight is ready':'Your first pattern is ready'):(dz?'Your first insight is on its way':'Your first pattern is on its way')}</h2><div class="row" style="gap:12px"><div class="pd" role="img" aria-label="${n} of 7 check-ins">${Array.from({length:7},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div><span class="why" style="font-weight:600">${n} of 7 check-ins</span></div></section>`;}
function noticeCard(t){const dz=S.discreet;
 return `<section class="card ntc"><p class="lbl">Something we noticed</p><h2 class="ct">${dz?'We spotted a pattern. Open My Story to see it.':t}</h2><p class="pnp">A pattern, not proof.</p></section>`;}
function extraCard(x){const dz=S.discreet;S._extra=x;
 return `<section class="card"><p class="lbl">For you</p><button class="art" data-a="readExtra"><span class="stack" style="gap:2px"><span class="ct" style="font-size:17px">${dz?x.d:x.t}</span><span class="meta" style="margin:0">${x.m}</span></span>${ic('chev')}</button></section>`;}
function currentNext(){const c=cfg(),T=TOPICS[S.topic]||TOPICS.whats,later=S.later&&c.later;
 if(S.altNext){const L=learnList();if(L.length){const k=L[(S.altNext-1)%L.length];return {...ARTS[k],m:'3-minute read',art:k};}}
 if(isDoctorCard())return {t:"Note when your periods changed and how you've been feeling, to show your doctor.",btn:'Start my note',act:'note',d:'Make a note for your doctor visit.'};
 if(c.next)return c.next;
 if(later&&c.later.next)return c.later.next;
 return T.next;}
function homeCards(){const c=cfg(),T=TOPICS[S.topic]||TOPICS.whats,later=S.later&&c.later;const out=[];
 if(S.redFlag)out.push(redCardH());
 out.push(isDoctorCard()?doctorCard():stageCardH());
 out.push(nextCard(currentNext()));
 const ck=c.check||(later&&c.later.check)||T.check;
 const useDevice=S.device.connected&&S.device.sleep&&ck===T.check&&T.sleep;
 out.push(useDevice?deviceCard():checkCard(ck));
 if(!S.redFlag){
  if(c.extra)out.push(extraCard(c.extra));
  else if(later&&c.later.notice)out.push(noticeCard(c.later.notice));
  else out.push(patternCard());}
 return out.join('');}
const TAB={};

 <div class="inbar" style="margin-top:8px"><label for="tk" class="sr">Message</label><input id="tk" placeholder="Ask me anything…" data-enter="talkSend"><button class="ib send" aria-label="Send" data-a="talkSend">${ic('send')}</button></div>`;

 if(!S.special&&g==='D')cyc=`<section class="card"><p class="lbl">${dz?'Tracker':'Cycle tracker'}</p><h2 class="ct">About ${S.months||'6'} months ${dz?'so far':'since your last period'}</h2><p class="cp">At 12 months I'll ask before updating anything.</p></section>`;
 const savedList=S.consentB!=='yes'?'<p class="cp">Health notes are off, so nothing is saved. You can turn them on in Settings → Privacy.</p>':S.saved.length?`<ul class="slist">${S.saved.map(i=>`<li>${ic('check',18)}<span>${dz?'Private note':esc(i.t)}</span></li>`).join('')}</ul>`:'<p class="cp">Nothing saved yet.</p>';
 const logs=S.log.length?`<ul class="slist">${S.log.map(l=>`<li>${ic('cal',18)}<span>Today · ${esc(l.q)} <b>${esc(l.a)}</b></span></li>`).join('')}</ul>`:'<p class="cp">Your check-ins will show here.</p>';
 return `${S.redFlag&&dz?`<p class="note" style="background:#FBE9E4;color:#6E2414">${S.bleedLogged?`You logged ${esc(S.bleedLogged)}.`:'You told me about bleeding after your periods stopped.'} Please see a gynaecologist within 1–2 weeks.</p>`:''}
 ${isDoctorCard()?doctorCard():stageCardH()}
 <section class="card"><p class="lbl">Saved to your Health Story</p>${savedList}</section>${cyc}
 <section class="card"><p class="lbl">Check-ins</p>${logs}</section>`;};

 const title={home:`${greet()}, ${esc(S.name)}`,talk:'Talk',story:'My Story',learn:'Learn'}[S.tab];
 return `<div class="scr${big?' big':''}"><header class="hh"><div class="row sb"><div class="row" style="gap:8px"><button class="ib1${S.discreet?' on':''}" aria-pressed="${S.discreet}" aria-label="Discreet mode" data-a="discreet">${ic('eye',22)}</button><button class="ib1" aria-label="Profile and settings" data-a="sheet" data-v="settings">${ic('user',22)}</button></div>${helpBtn()}</div>

function sheetHTML(){const k=S.sheet,dz=S.discreet;let h='';
 if(k==='help')h=`<div class="row sb"><h2 class="h2">Need help now?</h2>${closeBtn()}</div>
  <div class="emg"><b class="emh">In an emergency</b><div class="g2"><a class="call" href="tel:112">${ic('phone')}Call 112<small>Police or emergency</small></a><a class="call" href="tel:108">${ic('phone')}Call 108<small>Ambulance</small></a></div></div>
  <a class="hrow" href="tel:14416"><span class="oi">${ic('chat')}</span><span class="stack" style="flex:1;gap:2px"><b>Talk to someone: Tele-MANAS</b><small class="mut">Call 14416 · free, any time, in your language</small></span>${ic('chev')}</a>
  <button class="hrow" data-a="tele"><span class="oi">${ic('user')}</span><span class="stack" style="flex:1;gap:2px"><b>Talk to a gynaecologist</b><small class="mut">Book a video or phone consult</small></span>${ic('chev')}</button>
  <div class="hrow" style="flex-direction:column;align-items:stretch;gap:10px;cursor:default"><button class="art" aria-expanded="${S.hosp}" data-a="hosp"><span class="row" style="gap:14px"><span class="oi" style="background:#FCF1DB;color:#7A5410">${ic('alert')}</span><b>Go to hospital today if…</b></span>${ic(S.hosp?'up':'down')}</button>
  ${S.hosp?'<ul style="margin:0;padding-left:22px;font-size:15px;line-height:1.5;color:#3C4847"><li>[Urgent sign 1, clinical team to confirm]</li><li>[Urgent sign 2, clinical team to confirm]</li><li>[Urgent sign 3, clinical team to confirm]</li></ul>':''}</div>`;

 Object.assign(S,{name:P.name,year:P.year,phone:'9876543210',consentA:'yes',consentB:'yes',notifAsked:true,topic:P.topic,knows:P.knows,months:P.months||null,preset:k});
 if(keep){S.discreet=kp.discreet;S.device=kp.device;}
 startChat();autoRun(P.v);
 S.items=buildItems();S.items.forEach(i=>{i.state='yes';});S.saved=S.items.slice();

const JUMPS=[['welcome','Welcome'],['phone','Sign in'],['about','About you'],['consent','Consent'],['private','Keep private'],['device','Connect a device'],['brings','What brings you'],['stagek','Your stage'],['chat','First chat'],['save','Save'],['stagecard','Stage card'],['home','Home']];
const curJump=k=>S.screen===k||(k==='phone'&&S.screen==='code')||(k==='about'&&S.screen==='under18');
function jump(v){S.locked=false;S.sheet=null;
 if(['welcome','phone','about','consent','private','device'].includes(v)){go(v);return;}
 if(!S.name)S.name='Meera';if(!S.year)S.year=1981;if(!S.consentA){S.consentA='yes';S.consentB='yes';}

 else if(p==='later'){S.later=!S.later;S.checkDone=null;S.altNext=0;render();}
 else if(p==='discreet'){S.discreet=!S.discreet;render();}
 else if(p==='device'){const d=S.device;d.connected=!d.connected;if(d.connected){d.sleep=true;d.src=d.src||'Google Health Connect';}S.checkDone=null;render();}
 else if(p==='prompt12'){S.sheet='prompt12';render();}
 else if(p==='lock'){if(S.pin||S.bio){S.sheet=null;S.locked=true;S.lockBuf='';render();}else toast('Set a PIN in “Keep private” first. Without one, NAARIZE opens straight away.');}
 else if(p==='restart'){clearInterval(codeTimer);S=fresh();go('welcome');}});

/* ---------- fit the phone to the window ---------- */
function fit(){const narrow=innerWidth<900;const w=narrow?document.documentElement.clientWidth-32:innerWidth-32-28-380;const h=narrow?Infinity:innerHeight-48;
 const s=Math.max(.5,Math.min(1,w/418,h/872));document.documentElement.style.setProperty('--s',s.toFixed(3));}
addEventListener('resize',fit);fit();
render();
</script>
